name: Publish verified v1.3 package
on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v1.3.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-v1.3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Fetch and verify reviewed package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 --branch main https://github.com/miocean/RoadRash-Steam-Chinese-Patch.git package
          if ($LASTEXITCODE -ne 0) { throw 'Clone failed' }
          Set-Location package
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'Branch advanced; review required' }
          $folder = 'release/v1.3'
          $expected = @{
            'RoadRash_Steam_ZH_v1.3.exe' = '7c17cb456683cd6f61615015bf9d308e769b96c13bcfccc231473d595472e4f1'
            'RoadRash_Steam_ZH_v1.3.zip' = 'd2e9a09abd410af6a592c5673e73f91a6e4cae6709c37a21ad5c1ef23495c75c'
          }
          foreach ($name in $expected.Keys) {
            if ((Get-FileHash -LiteralPath "$folder/$name" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected[$name]) { throw "Package hash mismatch: $name" }
          }
          if ((Get-FileHash payload/ENU.DLL -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ebb8b2c7168907730a3d7a57638646918581f48cfed4e20cb3afad7c4df8c1cb') { throw 'Language payload mismatch' }
      - name: Publish existing verified binaries
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location package
          gh release view v1.3 --repo miocean/RoadRash-Steam-Chinese-Patch 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'v1.3 already exists; will not overwrite' }
          gh release create v1.3 release/v1.3/RoadRash_Steam_ZH_v1.3.exe release/v1.3/RoadRash_Steam_ZH_v1.3.zip release/v1.3/SHA256SUMS.txt --repo miocean/RoadRash-Steam-Chinese-Patch --target $env:GITHUB_SHA --title 'v1.3 精修译文、旧版姓名与闲聊立绘修复' --notes-file RELEASE_NOTES.md --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }